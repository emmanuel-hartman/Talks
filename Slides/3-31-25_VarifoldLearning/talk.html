<section data-markdown>
	<textarea data-template>
	<h4 align="left">Parameterization Invariant Feature Vectors for Surface Data</h4><hr>
	<div class="row" align="left">
		<div class="col-md-8" align="left" markdown="1">
		<p>Fix a 2-manifold $M$. Consider the space of parameterized objects $\Imm = \operatorname{Imm}(M,\R^3)$ acted on by a group of reparameterizations $\Diff= \operatorname{Diff}(M)$.
		<br>The goal of shape learning is to approximate a function $f:\Imm \to \mathcal{Y}$ which is <b>invariant</b> to the action of $\Diff$. i.e. $$\text{for any  } q\in\Imm \text{ and } \gamma\in\Diff, \quad f(q)=f(q\circ\gamma).$$</p>
		<br><br>
		<p class="fragment fade-left">To ensure our approximations of $f$ have the desired invariance, we will construct $E:\Imm\to \mathcal{L} = \R^m$ so that $E$ is invariant to $\Diff$.<br><br>Then, we learn a function $g:\mathcal{L}\to \mathcal{Y}$ such that $$g\circ E \approx f.$$</p>
		</div>
		<div class="col-md-4" align="center" markdown="1">
			<img src="figs/classification.png" width="90%"/>
			<img src="figs/reconstruction1.jpg" width="75%"/>
		</div>
	</div>
	</textarea>
</section>

<section data-markdown>
	<textarea data-template>
		<h4 align="left">Representations from Geometric Measure Theory$^{1,2,3,4}$</h4><hr>
		<div class="row">
		<div class="col-md-8" markdown="1" align="left">
		<p>For any $q\in \Imm$ we can associate a varifold $\mu_q\in\mathcal{M}(\mathbb R^3\times S^{2})$ as the push forward measure $\mu_q:= (q,n_q)_*\operatorname{vol}_q$ where $n_q$ is the Gauss of $q$.<br>
		Thus, for a test function $\omega\in C_1(\R^3\times S^2, \R)$,
		$$\mu_q(\omega) = \int_M \omega(q,n_q) \operatorname{d} \operatorname{vol}_q .$$	
		By a change of variables, for any $\gamma\in\Diff$, $\mu_{q\circ\gamma} = \mu_q$.</p><br>
		<p class="fragment" data-fragment-index="1"><br>To represent a varifold with a fixed finite dimension requires solving a quantization problem. Thus, we cannot directly use the varifold representations.</p><br>
		<p class="fragment" data-fragment-index="1"><br>We may equip $\mathcal{M}(\mathbb R^3\times S^{2})$ with an RKHS norm $\|\cdot\|_V$.</p>
	</div>
		<div class="col-md-4" markdown="1" align="right"><img src="figs/Face_fullsample.png" width="40%" /><img src="figs/Face_downsampled.png" width="40%" /><hr><img src="figs/varifold_similar.png" width="100%" /></div>
		<p align="left"><sub>$^1$Charon & Trouvé. "The varifold representation of nonoriented shapes for diffeomorphic registration."</sub><br>
		<sub>$^2$Kaltenmark, et al. "A general framework for curve and surface comparison and registration with oriented varifolds."</sub><br>
	  	<sub>$^3$Feydy et al. "Optimal transport for diffeomorphic registration"</sub><br>
    	<sub>$^4$ Roussillon & Glaunès. "Representation of surfaces with normal cycles and application to surface registration."</sub><br></p>
		</div>
	</textarea>
</section>

<section data-markdown>
<textarea data-template>
<h4 align="left">Approach 1: Varifold Gradient For Representing Shapes</h4><hr>
<div class="row" align = "left">
	<p>Consider a template $\mathcal{T}\in \Imm$ discretized by a triangular mesh with $M$ vertices and define the following operator: </p>
<div class="col-md-12" markdown="1" align="center">
	<p>$$\begin{align}\operatorname{VariGrad}:\Imm&\to\R^{3M}\\
	q&\mapsto \nabla_{\vec{0}}\|\mu_q - \mu_{\mathcal{T} + (\cdot)}\|_V^2 = C - 2 \nabla_{\vec{0}}\langle\mu_q , \mu_{\mathcal{T}+(\cdot)}\rangle_V\end{align}$$<br></p>
	<div>
<div class="col-md-6" markdown="1" align="left">
	<p class="fragment fade-left">+ $q$ can represented by a mesh with any number of vertices and any mesh structure and $\operatorname{VariGrad}(q)$ will have dimension $\R^{3M}$. <br><br></p>
	<p class="fragment fade-left">+ $\operatorname{VariGrad}(q)$ gives a first order approximation of how to deform $\mathcal{T}$ into the same shape as $q$. <br><br></p>
	<p class="fragment fade-left">+ $\operatorname{VariGrad}(q)$ is invariant to parameterization and robust to imaging noise. <br><br></p>
</div>
<div class="col-md-6" markdown="1" align="center"><br><img src="figs/VarigradVisualization.png" width="100%"/></div>
</div>
</textarea>
</section>

<section data-markdown>
<textarea data-template>
<h4 align="left">VariGrad for Surface Reconstruction</h4><hr>
<div class="row">
<div class="col-md-12" markdown="1" align="left" style="line-height:50%;">
	<p>Consider $\Imm_F \subset \Imm$ as the space of all surfaces represented by a mesh with a fixed mesh structure $F$. Our goal will be to learn $f:\Imm \to \Imm_F$ such that $f(q)$ is the same shape as $q$.</p><br><br>
</div>
<div class="col-md-8" markdown="1" align="left">
	<p>We attempt to learn such a function the DFAUST[1] dataset which consists of ~40,000 scans. This dataset includes mesh representations of each of the scans with a fixed mesh structure $F$.</p><br><br>
	<p>We train the models with ~80% of the registered DFAUST to minimize the mean square error of the vertex positions.</p><br><br>
	<p>Despite being trained on registered data, the model can be applied to meshes with any number of vertices and any mesh structure.</p>
</div>
<div class="col-md-4" markdown="1" align="left">
	<img src="figs/VariGrad_AutoEncode.png" width="100%"/><br><br>
	<img src="figs/VariGradOnPhoneScan.png" width="100%"/>
</div>
</div>
<p align="left"><sub>$^{1}$ Bogo, et al. "Dynamic FAUST: Registering Human Bodies in Motion"</sub><br>
</textarea>
</section>

<section data-markdown>
<textarea data-template>
<h4 align="left">VariGrad for Clustering</h4><hr>
<div class="row" align ="left">
	<p>We consider a dataset of 3D surfaces representing left atrial appendages (LAA) of a large cohort (n=1184) of patients. Several works have shown that morphological changes in the LAA are correlated to ischemic stroke[1,2].</p>
	<br><p>Previous works (i.e. [1]) have considered LAAs which are manually classified as one of four morphological types and shown there is significant difference in relative stroke rates of these clusters. </p>
	<div class="col-md-8" markdown="1" align="left"><br>
		<p>We will perform clustering and classification using the VariGrad representations of the data.</p>
	</div>

	<section data-markdown>
	<textarea data-template>
	<h4 align="left">Approach 2 : Learned Test Functions</h4><hr>
	<div class="row" align="left">
	<p>Another approach to using varifold representations of surfaces for machine learning is to learn a set of test functions $\{\omega_i\}_{i=1}^m\subseteq C_1(\R^3\times S^2,\R)$ and consider the evaluation of the functions by the varifolds associated with the data.</p><br><br>
	<div class="col-md-7" markdown="1" align="left">		
	<p>In particular, we may define a map $E:\mathcal{I} \to \mathcal{L}=\R^m$ where $$E(q)_i = \int_M \omega_i(q, n_q) \operatorname{d vol}_q.$$</p>
	<p>We will model $\{\omega_i\}_{i=1}^m$ by a simple multilayer perceptron with 2 hidden layers from $\R^6$ to $\R^m$. </p><br><br>
	<p>For today, we will consider this model for classification tasks where $m$ is the number of classes and $E(q)_i$ represents the likelihood that $q$ is in the $i$-th class.</p>
	</div>
	<div class="col-md-3" markdown="1" align="right">		
		<img src="figs/MLP.png" width="100%"/>
	</div>
	</div>
	</textarea>
	</section>

<script>
    Reveal.initialize({
        controls: true,
        progress: false,
        center: true,
        hash: true,
        width: 1280,
        height: 720,
        plugins: [RevealMath.MathJax2, RevealZoom, RevealNotes, RevealSearch, RevealMarkdown, RevealHighlight]
    });

    function initThreeJS(container) {
        const plyFile = container.dataset.ply;
        if (!plyFile) return;

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
        scene.add(light);

        // Load PLY Model
        const loader = new THREE.PLYLoader();
        loader.load(plyFile, function (geometry) {
            geometry.computeVertexNormals();
            const material = new THREE.MeshStandardMaterial({ color: 0x0077ff, flatShading: true });
            const model = new THREE.Mesh(geometry, material);
			model.rotation.x = -Math.PI ;
            scene.add(model);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    }

    // Initialize 3D models when slides become visible
    Reveal.on("slidechanged", event => {
    const prevSlide = event.previousSlide;
		if (prevSlide) {
			const oldContainers = prevSlide.querySelectorAll(".threejs-container");
			oldContainers.forEach(container => {
				while (container.firstChild) {
					container.removeChild(container.firstChild);  // 🔹 Remove WebGL canvas
				}
			});
		}
        const containers = event.currentSlide.querySelectorAll(".threejs-container");
        containers.forEach(initThreeJS);
    });
</script>
